# Example baton configuration. Copy to ~/.config/baton/config.toml and adjust.
#
# Each [agents.<name>] table describes one agent CLI.
#   adapter  one of: claude, codex, agy, pi
#   command  executable looked up in PATH
#   model    optional model name passed to the agent
#   provider model provider identity for review (set explicitly for agy and pi)
#   limit_patterns optional non-empty array of Python regex strings; REPLACES defaults
#     Example inside an agent table (uncomment and tailor to recorded failure text):
#     limit_patterns = ['usage[_ -]limit', 'insufficient_quota', 'quota exhausted']
# Cooldowns are shared by configured name across repositories. A detected limit without
# a usable reset time uses 1h. Manual: baton cooldown claude-sonnet 2h
# Inspect: baton status; after manual login or reset: baton recheck claude-sonnet
# Implementation routes try each name once, skip cooldowns, and hand off only on limits.
# --agent pins implementation only; fix/review still use their role routes.
# On Verify failure: same-tier fix, reverify, then one L fix and final reverify.
# Starting at L still allows two L repair attempts. Quota handoffs stay within an attempt.
# Review runs after passing or absent Verify in an empty temporary directory, using the
# final diff and new-file contents. Critical/warning/informational findings inform manual commit.
# Review excludes ALL implementation/fix providers, including partial work before handoff.
# Provider names are stripped and case-insensitive; aliases must name the actual provider.
# Include an independent third provider when implementation/fixes may use Anthropic and OpenAI.
# Missing required routes, unknown author identity, unavailable review or invalid JSON leave
# the step open. Legacy agents-only configs do not automatically fix or review.
# --dry-run starts no agents. Login/account selection and commits stay manual.
# Model IDs and aliases below are examples. Adjust them to match your CLI and account.

[agents.claude-opus]
adapter = "claude"
command = "claude"
model = "opus"

[agents.claude-sonnet]
adapter = "claude"
command = "claude"
model = "sonnet"

[agents.claude-haiku]
adapter = "claude"
command = "claude"
model = "haiku"

[agents.codex]
adapter = "codex"
command = "codex"

[agents.codex-astra]
adapter = "codex"
command = "codex"
model = "gpt-6.2-astra"

[agents.agy]
adapter = "agy"
command = "agy"
model = "gemini-4-argon-high"
provider = "google"

[agents.pi-ollama]
adapter = "pi"
command = "pi"
model = "ollama/qwen2.5-coder"
provider = "ollama"

[agents.pi-openrouter]
adapter = "pi"
command = "pi"
model = "openrouter/deepseek/deepseek-chat"
provider = "deepseek"

[routes.plan_roadmap]
S = ["claude-opus", "codex-astra", "agy"]
M = ["claude-opus", "codex-astra", "agy"]
L = ["claude-opus", "codex-astra", "agy"]

# `baton plan`: the tier is the milestone's Size (or --tier); the reply is the plan text.
[routes.plan_commits]
S = ["claude-sonnet", "agy"]
M = ["claude-sonnet", "agy"]
L = ["claude-opus", "codex-astra", "agy"]

[routes.implement]
S = ["pi-ollama", "claude-haiku"]
M = ["claude-sonnet", "codex"]
L = ["claude-sonnet", "agy", "codex"]

[routes.fix]
S = ["claude-haiku", "codex"]
M = ["claude-sonnet", "agy", "codex"]
L = ["claude-opus", "codex-astra", "agy"]

[routes.review]
S = ["claude-opus", "codex-astra", "agy"]
M = ["claude-opus", "codex-astra", "agy"]
L = ["claude-opus", "codex-astra", "agy"]

# `baton auto` defaults; every key is optional (CLI flags win).
# [auto]
# notify = "notify-send"            # "none" (default) | "notify-send" | "ntfy"
# ntfy_url = "https://ntfy.sh/my-private-topic"  # required for notify = "ntfy"
# merge = true                      # false: stop after the PR is published
# max_steps = 50                    # budget of one auto run
# max_hours = 12
# recheck_interval_seconds = 300  # opt in to periodic read-only cooldown probes

# Optional per-agent setting: daily_run_budget = 100 (positive integer, UTC day).
# Optional per-agent setting: weight = 2 (positive integer; omitted members use 1).
