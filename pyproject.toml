[project]
name = "baton"
version = "0.1.0"
description = "Orchestrates coding agent CLIs through a commit plan."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
baton = "baton.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
